name: localserve
description: "LocalServe — A local services marketplace app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---------- State Management ----------
  flutter_riverpod: ^2.6.1

  # ---------- Firebase ----------
  firebase_core: ^3.12.1
  firebase_auth: ^5.6.5
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.4

  # ---------- Routing ----------
  go_router: ^14.8.1

  # ---------- UI Helpers ----------
  pinput: ^5.0.1         # OTP input fields
  google_fonts: ^6.2.1   # Typography
  intl: ^0.20.2          # Date/time formatting

  # ---------- Location ----------
  geolocator: ^13.0.2    # Current location

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
